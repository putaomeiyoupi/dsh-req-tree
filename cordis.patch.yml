# dsh-req-tree bundle patch: mounts the req-tree viewer into a dsh profile.
#
# The host half registers a read-only browser route that reads a workspace's
# req-tree `tree.json`; the client half contributes one right-sidebar tab that
# renders it. Nothing here writes to the source of truth — all writes stay with
# the `todoctl` CLI, which is req-tree's first invariant.
#
# Install: `dsh plugin --profile <name> add dsh-req-tree` (npm or a local path).
- insert:
    - id: req-tree
      # Node-resolvable package name — must stay in sync with package.json `name`.
      # Quoted because `@` is a reserved indicator in YAML and cannot open a plain
      # scalar.
      name: 'dsh-req-tree'
      config:
        # Seconds between panel refreshes. The tree only changes when someone
        # runs `todoctl`, so this can stay slow without the panel feeling stale.
        pollSeconds: 3
        # Cap on nodes returned per workspace, so a very large tree cannot stall
        # the poll. Truncation is announced in the panel, never silent.
        maxNodes: 5000
        # Optional: pin the source of truth instead of auto-detecting it. Leave
        # unset to use the same precedence as `todoctl` itself:
        #   TODOCTL_ROOT > already-a-source-of-truth > pre-created dir
        #   > git root/docs/requirements > .req-tree/requirements
        # root: ''
